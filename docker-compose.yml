services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    volumes:
      - payroll_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - payroll_net

  app:
    build: .
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://payroll:payroll@db:5432/payroll
      PAYROLL_CLIENT_LOGO_PATH: /app/Images/Anonymous_Logo.jpg
      PAYROLL_PROVIDER_LOGO_PATH: /app/Images/Gamma_heads_Logo_Black.jpg
      PAYROLL_CRA_PAYROLL_ACCOUNT: "10668 8385 RP0001"
      PAYROLL_CRA_CONTACT_PHONE: "392-0015"
      PAYROLL_CRA_CONTACT_EMAIL: "dannym.asdf@gmail.com"
      PAYROLL_DEFAULT_EMPLOYMENT_PROVINCE: ON
      PAYROLL_RQ_EMPLOYER_ID: "1003372801"
      PAYROLL_RQ_PARTNER_REGISTRATION: "I1000625"
      PAYROLL_RQ_NEQ: "1142427765"
      PAYROLL_RQ_PARTNER_ID: "0000000000000271"
      PAYROLL_RQ_PREPARATEUR_NO: "NP100625"
      PAYROLL_RQ_CERTIFICATION_NO: "RQ-26-01-010"
      PAYROLL_RQ_DOSSIER_NO: "0271"
      PAYROLL_RQ_RELEVE_SEQ_BASE: "71997012"
      DEMO_API_KEY: gamma-dev-api-key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payroll_net

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - payroll_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Host port 80 is often taken on Debian (apache2/nginx). Override: NGINX_PORT=80 docker compose up
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kong
    restart: unless-stopped
    networks:
      - payroll_net

  # Optional: direct app access for debugging (bypass NGINX/Kong)
  # Start with: docker compose --profile dev up
  app-direct:
    build: .
    profiles:
      - dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://payroll:payroll@db:5432/payroll
      PAYROLL_CLIENT_LOGO_PATH: /app/Images/Anonymous_Logo.jpg
      PAYROLL_PROVIDER_LOGO_PATH: /app/Images/Gamma_heads_Logo_Black.jpg
      PAYROLL_CRA_PAYROLL_ACCOUNT: "10668 8385 RP0001"
      PAYROLL_CRA_CONTACT_PHONE: "392-0015"
      PAYROLL_CRA_CONTACT_EMAIL: "dannym.asdf@gmail.com"
      PAYROLL_DEFAULT_EMPLOYMENT_PROVINCE: ON
      PAYROLL_RQ_EMPLOYER_ID: "1003372801"
      PAYROLL_RQ_PARTNER_REGISTRATION: "I1000625"
      PAYROLL_RQ_NEQ: "1142427765"
      PAYROLL_RQ_PARTNER_ID: "0000000000000271"
      PAYROLL_RQ_PREPARATEUR_NO: "NP100625"
      PAYROLL_RQ_CERTIFICATION_NO: "RQ-26-01-010"
      PAYROLL_RQ_DOSSIER_NO: "0271"
      PAYROLL_RQ_RELEVE_SEQ_BASE: "71997012"
      DEMO_API_KEY: gamma-dev-api-key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - payroll_net

networks:
  payroll_net:

volumes:
  payroll_pg_data:
